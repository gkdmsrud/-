<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등학생 영어 스펠링 맞추기 게임</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Gaegu / Jua for cute vibe) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    body {
      font-family: 'Jua', 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .font-en {
      font-family: 'Nunito', sans-serif;
    }

    /* Custom bounce & pop animations */
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Dragging ghost styling */
    .dragging {
      opacity: 0.5;
      transform: scale(0.95);
    }

    .drop-hover {
      border-color: #3B82F6 !important;
      background-color: #EFF6FF !important;
      transform: scale(1.05);
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-200 via-indigo-100 to-purple-200 min-h-screen flex flex-col items-center justify-between p-4 overflow-x-hidden">

  <!-- Header & Scoreboard -->
  <header class="w-full max-w-3xl flex items-center justify-between bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-lg border-2 border-white mb-4">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-400 text-yellow-900 w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-md font-extrabold">
        <i class="fa-solid fa-star"></i>
      </div>
      <div>
        <span class="text-xs text-gray-500 font-bold block">나의 점수</span>
        <span id="score" class="text-3xl text-indigo-700 font-extrabold">0</span>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-xl sm:text-2xl font-black text-indigo-900 tracking-wide text-center">
      🔤 스펠링 블록 맞추기
    </h1>

    <!-- Progress / Level -->
    <div class="flex items-center gap-2">
      <div class="text-right">
        <span class="text-xs text-gray-500 font-bold block">진행 상황</span>
        <span id="progress-text" class="text-lg text-purple-700 font-bold">1 / 25</span>
      </div>
      
      <!-- Speech Speed Selector -->
      <div class="relative inline-block">
        <select id="speech-rate-select" onchange="changeSpeechRate(this.value)" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-900 font-bold text-xs py-2 px-2 rounded-xl border-2 border-indigo-300 outline-none cursor-pointer shadow-sm transition-all">
          <option value="0.65">🐢 느리게</option>
          <option value="0.85" selected>▶️ 보통</option>
          <option value="1.05">🐇 빠르게</option>
        </select>
      </div>

      <button id="speaker-btn" onclick="speakCurrentWord()" class="bg-sky-400 hover:bg-sky-500 active:scale-95 text-white w-11 h-11 rounded-xl flex items-center justify-center text-xl shadow-md transition-all">
        <i class="fa-solid fa-volume-high"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="w-full max-w-3xl flex-1 flex flex-col justify-center items-center gap-6">

    <!-- Word Hint Card -->
    <div class="w-full bg-white rounded-3xl p-6 shadow-xl border-4 border-indigo-200 flex flex-col items-center text-center relative overflow-hidden transition-all duration-300">
      
      <!-- Category Badge -->
      <span id="category-badge" class="absolute top-4 left-4 bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-bold">
        단어 퀴즈
      </span>

      <!-- Hint Icon / Meaning -->
      <div class="mt-2 mb-1">
        <span id="korean-meaning" class="text-3xl sm:text-4xl font-extrabold text-gray-800 tracking-tight">
          수업, 반
        </span>
      </div>
      
      <p class="text-gray-400 text-sm font-semibold mt-1">
        아래 알파벳 블록을 끌어다 빈칸에 채워보세요!
      </p>
    </div>

    <!-- Target Blank Slots Box (Central Droppable Area) -->
    <div class="w-full bg-white/60 backdrop-blur-sm rounded-3xl p-6 shadow-inner border-2 border-white/80 min-h-[140px] flex items-center justify-center">
      <div id="target-slots" class="flex flex-wrap gap-2 sm:gap-3 justify-center items-center w-full">
        <!-- Target slots will be generated by JS -->
      </div>
    </div>

    <!-- Alphabet Letter Pool Box (Horizontal Scroll/Wrap at bottom) -->
    <div class="w-full bg-indigo-900/10 rounded-3xl p-5 border-2 border-indigo-300/40 backdrop-blur-sm">
      <div class="text-center text-indigo-800 text-xs font-extrabold mb-3 flex items-center justify-center gap-2">
        <i class="fa-solid fa-hand-pointer animate-bounce"></i>
        <span>알파벳 블록을 선택하거나 드래그하세요</span>
      </div>
      
      <!-- Letter Blocks Container -->
      <div id="letter-pool" class="flex flex-wrap gap-2 sm:gap-3 justify-center items-center min-h-[80px]">
        <!-- Shuffled letter blocks will be generated here -->
      </div>
    </div>

  </main>

  <!-- Control Buttons & Audio Speech Trigger -->
  <footer class="w-full max-w-3xl mt-4 flex justify-between items-center gap-4">
    <button onclick="resetCurrentWord()" class="bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-700 font-bold px-5 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2">
      <i class="fa-solid fa-rotate-left"></i>
      <span>다시하기</span>
    </button>

    <div class="flex gap-2">
      <button onclick="giveHint()" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold px-5 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2">
        <i class="fa-solid fa-lightbulb"></i>
        <span>힌트</span>
      </button>
      
      <button id="next-btn" onclick="nextWord()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold px-6 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2 hidden">
        <span>다음 단어</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </footer>

  <!-- Modal for Game Completion -->
  <div id="completion-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl animate-pop border-4 border-yellow-300">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-3xl font-black text-indigo-900 mb-2">대단해요! 축하합니다!</h2>
      <p class="text-gray-600 font-bold mb-6">모든 단어의 스펠링을 완벽하게 맞췄어요!</p>
      
      <div class="bg-indigo-50 rounded-2xl p-4 mb-6">
        <span class="text-sm text-gray-500 font-bold block">최종 점수</span>
        <span id="final-score" class="text-4xl text-indigo-700 font-extrabold">0</span>
      </div>

      <button onclick="restartGame()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition-all">
        처음부터 다시 놀기 🚀
      </button>
    </div>
  </div>

  <script>
    // Word List provided by user
    const WORD_LIST = [
      { word: "Class", meaning: "수업, 반", category: "학교" },
      { word: "Homework", meaning: "숙제", category: "학교" },
      { word: "Teacher", meaning: "선생님", category: "학교" },
      { word: "Friend", meaning: "친구", category: "사람" },
      { word: "Desk", meaning: "책상", category: "물건" },
      { word: "Chair", meaning: "의자", category: "물건" },
      { word: "Pencil", meaning: "연필", category: "학용품" },
      { word: "Eraser", meaning: "지우개", category: "학용품" },
      { word: "Happy", meaning: "행복한", category: "감정" },
      { word: "Sad", meaning: "슬픈", category: "감정" },
      { word: "Angry", meaning: "화난", category: "감정" },
      { word: "Tired", meaning: "피곤한", category: "감정" },
      { word: "English", meaning: "영어", category: "과목" },
      { word: "Math", meaning: "수학", category: "과목" },
      { word: "Music", meaning: "음악", category: "과목" },
      { word: "P.E.", meaning: "체육", category: "과목" },
      { word: "Drink", meaning: "마시다", category: "동사" },
      { word: "Study", meaning: "공부하다", category: "동사" },
      { word: "Play", meaning: "놀다, (악기를) 연주하다", category: "동사" },
      { word: "Read", meaning: "읽다", category: "동사" },
      { word: "Write", meaning: "쓰다", category: "동사" },
      { word: "Sleep", meaning: "잠자다", category: "동사" },
      { word: "Weather", meaning: "날씨", category: "날씨" },
      { word: "Sunny", meaning: "화창한", category: "날씨" },
      { word: "Rainy", meaning: "비가 오는", category: "날씨" },
      { word: "Cloudy", meaning: "흐린", category: "날씨" }
    ];

    // Web Audio API for Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // Game States
    let gameWordList = []; // Randomized active word list per session
    let currentWordIndex = 0;
    let score = 0;
    let currentShuffledLetters = [];
    let placedLetters = []; // stores letter object or null for each slot
    let draggedElementData = null;
    let currentSpeechRate = 0.85; // Default speech rate (보통)

    // Elements
    const targetSlotsContainer = document.getElementById('target-slots');
    const letterPoolContainer = document.getElementById('letter-pool');
    const koreanMeaningEl = document.getElementById('korean-meaning');
    const categoryBadgeEl = document.getElementById('category-badge');
    const scoreEl = document.getElementById('score');
    const progressTextEl = document.getElementById('progress-text');
    const nextBtn = document.getElementById('next-btn');

    // Shuffle Array Helper
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Speech Rate Change Handler
    function changeSpeechRate(val) {
      currentSpeechRate = parseFloat(val);
      playSound('click');
    }

    // Initialize Game
    function initGame() {
      // 1. Shuffle Word List for current session (Prevent repeat/missing)
      gameWordList = shuffleArray(WORD_LIST);
      currentWordIndex = 0;
      score = 0;
      scoreEl.textContent = score;
      loadWord(currentWordIndex);
    }

    // Load Single Word
    function loadWord(index) {
      nextBtn.classList.add('hidden');
      const item = gameWordList[index];
      koreanMeaningEl.textContent = item.meaning;
      categoryBadgeEl.textContent = item.category;
      progressTextEl.textContent = `${index + 1} / ${gameWordList.length}`;

      const cleanWord = item.word; // e.g., "P.E." or "Class"
      const characters = cleanWord.split('');

      // Init placed state
      placedLetters = new Array(characters.length).fill(null);

      // Create shuffled letters with unique IDs
      const letterObjects = characters.map((char, i) => ({
        id: `letter-${i}-${char}-${Math.random().toString(36).substr(2, 5)}`,
        char: char
      }));

      // Shuffled alphabet blocks for current word
      currentShuffledLetters = shuffleArray(letterObjects);

      renderSlots(characters);
      renderPool(currentShuffledLetters);

      // Speak word when loaded with selected speed
      setTimeout(() => speakCurrentWord(), 400);
    }

    // Render Blank Target Slots
    function renderSlots(characters) {
      targetSlotsContainer.innerHTML = '';
      characters.forEach((char, slotIndex) => {
        const isSpecialChar = char === '.' || char === ' ' || char === '-';

        const slot = document.createElement('div');
        
        if (isSpecialChar) {
          // Non-fillable special symbols like dots in P.E.
          slot.className = "w-8 h-14 sm:w-12 sm:h-16 flex items-end justify-center text-3xl font-extrabold text-indigo-900 pb-2 font-en";
          slot.textContent = char;
          placedLetters[slotIndex] = { char: char, isFixed: true };
        } else {
          slot.className = "target-slot w-12 h-14 sm:w-16 sm:h-20 bg-indigo-50/80 border-4 border-dashed border-indigo-300 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl font-extrabold text-indigo-900 transition-all duration-200 cursor-pointer shadow-inner relative font-en";
          slot.dataset.index = slotIndex;

          // Drag and Drop Events for Slot
          slot.addEventListener('dragover', handleDragOver);
          slot.addEventListener('dragenter', handleDragEnter);
          slot.addEventListener('dragleave', handleDragLeave);
          slot.addEventListener('drop', handleDrop);

          // Click to remove letter from slot
          slot.addEventListener('click', () => removeLetterFromSlot(slotIndex));
        }

        targetSlotsContainer.appendChild(slot);
      });
    }

    // Render Bottom Letter Pool
    function renderPool(letters) {
      letterPoolContainer.innerHTML = '';
      letters.forEach((item) => {
        const block = createLetterBlock(item);
        letterPoolContainer.appendChild(block);
      });
    }

    // Create Draggable Letter Block UI
    function createLetterBlock(item) {
      const block = document.createElement('div');
      block.id = item.id;
      block.dataset.char = item.char;
      block.className = "letter-block bg-gradient-to-b from-yellow-300 to-amber-400 text-amber-950 border-b-4 border-amber-600 w-12 h-14 sm:w-16 sm:h-18 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl font-black shadow-lg cursor-grab active:cursor-grabbing hover:-translate-y-1 transition-all duration-150 animate-pop font-en select-none";
      block.textContent = item.char;
      block.draggable = true;

      // Drag Events
      block.addEventListener('dragstart', (e) => {
        draggedElementData = item;
        e.dataTransfer.setData('text/plain', JSON.stringify(item));
        block.classList.add('dragging');
      });

      block.addEventListener('dragend', () => {
        block.classList.remove('dragging');
        draggedElementData = null;
      });

      // Click to auto-fill into first empty slot
      block.addEventListener('click', () => {
        playSound('click');
        autoFillLetter(item);
      });

      return block;
    }

    // Auto-fill letter into next empty target slot
    function autoFillLetter(item) {
      const emptyIndex = placedLetters.findIndex(val => val === null);
      if (emptyIndex !== -1) {
        placeLetterInSlot(emptyIndex, item);
      }
    }

    // Place letter into a specific slot
    function placeLetterInSlot(slotIndex, item) {
      // If slot already has a letter, return old letter to pool first
      if (placedLetters[slotIndex] && !placedLetters[slotIndex].isFixed) {
        returnLetterToPool(placedLetters[slotIndex]);
      }

      placedLetters[slotIndex] = item;

      // Hide block from pool
      const poolBlock = document.getElementById(item.id);
      if (poolBlock) {
        poolBlock.classList.add('hidden');
      }

      // Render letter inside slot UI
      const slotEl = targetSlotsContainer.children[slotIndex];
      slotEl.innerHTML = `
        <div class="w-full h-full bg-gradient-to-b from-sky-400 to-indigo-500 text-white rounded-xl flex items-center justify-center text-2xl sm:text-3xl font-black shadow-md border-b-4 border-indigo-700 animate-pop font-en">
          ${item.char}
        </div>
      `;
      slotEl.classList.remove('border-dashed', 'bg-indigo-50/80');
      slotEl.classList.add('border-solid', 'border-indigo-400');

      checkWordCompletion();
    }

    // Remove letter from slot back to pool
    function removeLetterFromSlot(slotIndex) {
      const item = placedLetters[slotIndex];
      if (!item || item.isFixed) return;

      playSound('click');
      returnLetterToPool(item);
      placedLetters[slotIndex] = null;

      // Reset Slot UI
      const slotEl = targetSlotsContainer.children[slotIndex];
      slotEl.innerHTML = '';
      slotEl.className = "target-slot w-12 h-14 sm:w-16 sm:h-20 bg-indigo-50/80 border-4 border-dashed border-indigo-300 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl font-extrabold text-indigo-900 transition-all duration-200 cursor-pointer shadow-inner relative font-en";
    }

    // Return letter element to bottom pool
    function returnLetterToPool(item) {
      const poolBlock = document.getElementById(item.id);
      if (poolBlock) {
        poolBlock.classList.remove('hidden');
      }
    }

    // HTML5 Drag & Drop Handlers
    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e) {
      e.preventDefault();
      const slot = e.currentTarget;
      slot.classList.add('drop-hover');
    }

    function handleDragLeave(e) {
      const slot = e.currentTarget;
      slot.classList.remove('drop-hover');
    }

    function handleDrop(e) {
      e.preventDefault();
      const slot = e.currentTarget;
      slot.classList.remove('drop-hover');
      
      const slotIndex = parseInt(slot.dataset.index);
      if (isNaN(slotIndex)) return;

      try {
        const item = JSON.parse(e.dataTransfer.getData('text/plain')) || draggedElementData;
        if (item) {
          playSound('click');
          placeLetterInSlot(slotIndex, item);
        }
      } catch (err) {
        if (draggedElementData) {
          playSound('click');
          placeLetterInSlot(slotIndex, draggedElementData);
        }
      }
    }

    // Check if user finished spelling the word correctly
    function checkWordCompletion() {
      // Check if all non-fixed slots are filled
      const isAllFilled = placedLetters.every(item => item !== null);
      if (!isAllFilled) return;

      const currentTargetWord = gameWordList[currentWordIndex].word;
      const userSpelling = placedLetters.map(item => item.char).join('');

      // Compare case-insensitive or exact
      if (userSpelling.toLowerCase() === currentTargetWord.toLowerCase()) {
        // Correct Answer!
        playSound('correct');
        score += 10;
        scoreEl.textContent = score;

        // Trigger Confetti effect
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });

        // Speak word aloud
        speakCurrentWord();

        // Reveal Next Button
        if (currentWordIndex < gameWordList.length - 1) {
          nextBtn.classList.remove('hidden');
          nextBtn.classList.add('animate-bounce');
        } else {
          // Game Over - Win!
          setTimeout(() => showCompletionModal(), 800);
        }
      } else {
        // Wrong Answer Animation
        playSound('wrong');
        targetSlotsContainer.classList.add('animate-shake');
        setTimeout(() => {
          targetSlotsContainer.classList.remove('animate-shake');
        }, 500);
      }
    }

    // Speech Synthesis for English pronunciation
    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop ongoing speech
        const targetWord = gameWordList[currentWordIndex].word;
        const utterance = new SpeechSynthesisUtterance(targetWord);
        utterance.lang = 'en-US';
        utterance.rate = currentSpeechRate; // Applied speed setting
        utterance.pitch = 1.1; // Friendly tone for kids
        window.speechSynthesis.speak(utterance);
      }
    }

    // Hint Function
    function giveHint() {
      playSound('click');
      const targetWord = gameWordList[currentWordIndex].word;
      const characters = targetWord.split('');

      // Find first wrong or empty slot
      for (let i = 0; i < characters.length; i++) {
        const correctChar = characters[i];
        const currentPlaced = placedLetters[i];

        if (!currentPlaced || currentPlaced.char.toLowerCase() !== correctChar.toLowerCase()) {
          // Return wrong letter if present
          if (currentPlaced && !currentPlaced.isFixed) {
            returnLetterToPool(currentPlaced);
          }

          // Find correct letter in pool that is not yet used
          const availableBlock = currentShuffledLetters.find(item => {
            const poolEl = document.getElementById(item.id);
            const isHidden = poolEl ? poolEl.classList.contains('hidden') : false;
            return item.char.toLowerCase() === correctChar.toLowerCase() && !isHidden;
          });

          if (availableBlock) {
            placeLetterInSlot(i, availableBlock);
          }
          break; // Give only 1 hint at a time
        }
      }
    }

    // Reset current word state
    function resetCurrentWord() {
      playSound('click');
      loadWord(currentWordIndex);
    }

    // Go to Next Word
    function nextWord() {
      playSound('click');
      if (currentWordIndex < gameWordList.length - 1) {
        currentWordIndex++;
        loadWord(currentWordIndex);
      }
    }

    // Show Final Completion Modal
    function showCompletionModal() {
      document.getElementById('final-score').textContent = score;
      document.getElementById('completion-modal').classList.remove('hidden');
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.4 }
      });
    }

    // Restart Whole Game
    function restartGame() {
      document.getElementById('completion-modal').classList.add('hidden');
      initGame();
    }

    // Start on Page Load
    window.onload = () => {
